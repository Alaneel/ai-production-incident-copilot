name: helm chart
on:
  push:
    paths: ["deploy/helm/**", "deploy/signal-profiles/**", "services/**", "requirements-*.lock", ".github/workflows/chart.yml",
            "app/**", "build/**", "public/**", "worker/**", "package.json", "package-lock.json", "vite.config.ts", ".dockerignore"]
  pull_request:
    paths: ["deploy/helm/**", "deploy/signal-profiles/**", "services/**", "requirements-*.lock", ".github/workflows/chart.yml",
            "app/**", "build/**", "public/**", "worker/**", "package.json", "package-lock.json", "vite.config.ts", ".dockerignore"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: helm-chart-${{ github.ref }}
  cancel-in-progress: true
env:
  HELM_VERSION: v4.3.1
  HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
  KIND_VERSION: v0.33.0
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
jobs:
  install-on-kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Helm and kind
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" -o "$RUNNER_TEMP/helm.tgz"
          echo "${HELM_SHA256}  $RUNNER_TEMP/helm.tgz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm && install -m0755 "$RUNNER_TEMP/linux-amd64/helm" "$bin/helm"
          curl -fsSL "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" -o "$bin/kind"
          echo "${KIND_SHA256}  $bin/kind" | sha256sum --check && chmod 0755 "$bin/kind"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Render and policy checks
        run: bash deploy/helm/test-chart.sh
      - name: Build images exactly as released
        run: |
          for component in orchestrator mcp-server telemetry-gateway; do
            docker build --file "services/$component/Dockerfile" --tag "ghcr.io/alaneel/opspilot-$component:ci" .
          done
      - name: Create an owned kind cluster
        run: |
          kind create cluster --name opspilot-chart --image "$KIND_NODE_IMAGE" --wait 120s
          kind load docker-image --name opspilot-chart \
            ghcr.io/alaneel/opspilot-orchestrator:ci ghcr.io/alaneel/opspilot-mcp-server:ci ghcr.io/alaneel/opspilot-telemetry-gateway:ci
          kubectl create namespace shop
      - name: helm install (demo telemetry, no Kubernetes access)
        run: |
          helm install opspilot deploy/helm/opspilot --namespace opspilot --create-namespace \
            --set image.tag=ci --set image.pullPolicy=Never --wait --timeout 6m
          helm status opspilot --namespace opspilot
      - name: helm test (read-only diagnosis; a reader cannot approve)
        run: helm test opspilot --namespace opspilot --logs --timeout 3m
      - name: Demo diagnosis is cited, read-only, and cannot be approved by a reader
        run: |
          kubectl --namespace opspilot exec deploy/opspilot-orchestrator -- python -c '
          import json, os, urllib.request, urllib.error
          token = os.environ["ORCHESTRATOR_READ_TOKEN"]
          def post(path, body):
              request = urllib.request.Request("http://127.0.0.1:8080" + path, json.dumps(body).encode(),
                  {"Content-Type": "application/json", "Authorization": "Bearer " + token})
              try:
                  with urllib.request.urlopen(request, timeout=40) as response:
                      return response.status, json.load(response)
              except urllib.error.HTTPError as error:
                  return error.code, None
          status, body = post("/mcp", {"jsonrpc": "2.0", "id": 1, "method": "tools/call", "params": {
              "name": "diagnose_incident", "arguments": {"question": "Why is payment-service slow today?",
              "service": "payment-service", "wait_seconds": 25}}})
          view = body["result"]["structuredContent"]
          leading = view["hypotheses"][0]
          print(view["incident_id"], view["status"], "|", leading["cause"], leading["confidence"], "|", view["proposed_action"]["title"])
          assert view["status"] == "diagnosed", view["status"]
          assert leading["cause"] == "Database connection pool exhaustion", leading
          assert len(leading["evidence_ids"]) >= 2, leading
          # The gateway deployment catalog is synthetic, so no rollback is proposed.
          assert view["proposed_action"]["tool"] == "none", view["proposed_action"]
          code, _ = post("/v1/incidents/" + view["incident_id"] + "/approval", {"decision": "approve",
              "actor": "ci", "reason": "reader must not approve", "idempotency_key": "ci-reader-approval-1"})
          assert code == 403, code
          print("ok: cited diagnosis, no rollback without live deployment history, reader approval refused")'
          test "$(kubectl auth can-i get deployments --namespace default --as system:serviceaccount:opspilot:opspilot-mcp-server)" = no
      - name: The bundled console is served unchanged from the API origin
        run: |
          kubectl --namespace opspilot exec deploy/opspilot-orchestrator -- python -c '
          import hashlib, json, pathlib, urllib.error, urllib.request
          base = "http://127.0.0.1:8080"
          manifest = json.loads(pathlib.Path("/app/console/console-manifest.json").read_text())
          def get(path):
              with urllib.request.urlopen(base + path, timeout=10) as response:
                  return response.headers, response.read()
          headers, page = get("/")
          policy = headers["Content-Security-Policy"]
          assert manifest["inline_scripts_sha256"] and all("sha256-" + value in policy for value in manifest["inline_scripts_sha256"]), policy
          assert "unsafe-eval" not in policy and "default-src" in policy and "frame-ancestors" in policy, policy
          assert b"data-backend=\"same-origin\"" in page
          for name, entry in manifest["files"].items():
              headers, body = get("/" if name == "index.html" else "/" + name)
              assert hashlib.sha256(body).hexdigest() == entry["sha256"], name
              assert headers["Content-Type"] == entry["type"], (name, headers["Content-Type"])
              assert headers["X-Content-Type-Options"] == "nosniff", name
          # The page is public; the API behind it still needs a credential.
          try:
              urllib.request.urlopen(base + "/v1/incidents", timeout=10)
              raise SystemExit("the incident API answered without a credential")
          except urllib.error.HTTPError as error:
              assert error.code == 401, error.code
          assert json.load(urllib.request.urlopen(base + "/health", timeout=10))["console"] == "bundled"
          print("ok:", len(manifest["files"]), "console files served unchanged; scripts are limited to this origin and exported hashes")'
      - name: helm upgrade to discovery in one namespace keeps credentials
        run: |
          # A real Deployment for discovery to read, in the target namespace.
          kubectl --namespace shop create deployment payment-service --image=registry.k8s.io/pause:3.10
          kubectl --namespace shop rollout status deployment/payment-service --timeout 120s
          before="$(kubectl --namespace opspilot get secret opspilot-credentials -o jsonpath='{.data.orchestrator-read-token}')"
          helm upgrade opspilot deploy/helm/opspilot --namespace opspilot --reuse-values \
            --set discovery.enabled=true --set 'targetNamespaces={shop}' --set orchestrator.alerts.defaultEnvironment=shop \
            --wait --timeout 4m
          after="$(kubectl --namespace opspilot get secret opspilot-credentials -o jsonpath='{.data.orchestrator-read-token}')"
          test -n "$before" && test "$before" = "$after"
          helm test opspilot --namespace opspilot --logs --timeout 3m
      - name: Discovery reads the real Deployment's rollout history
        run: |
          kubectl --namespace opspilot exec deploy/opspilot-orchestrator -- python -c '
          import json, os, urllib.request
          request = urllib.request.Request("http://127.0.0.1:8080/mcp", json.dumps({"jsonrpc": "2.0", "id": 1,
              "method": "tools/call", "params": {"name": "diagnose_incident", "arguments": {
              "question": "Why is payment-service slow today?", "service": "payment-service", "environment": "shop",
              "wait_seconds": 25}}}).encode(), {"Content-Type": "application/json",
              "Authorization": "Bearer " + os.environ["ORCHESTRATOR_READ_TOKEN"]})
          result = json.load(urllib.request.urlopen(request, timeout=40))["result"]
          assert not result["isError"], result
          incident_id = result["structuredContent"]["incident_id"]
          state = json.load(urllib.request.urlopen(urllib.request.Request(
              "http://127.0.0.1:8080/v1/incidents/" + incident_id,
              headers={"Authorization": "Bearer " + os.environ["ORCHESTRATOR_READ_TOKEN"]}), timeout=10))
          sources = sorted({item["source"] for item in state["evidence"] if item["kind"] == "deployment"})
          print(incident_id, state["status"], sources)
          assert "kubernetes-api-owned-revision-history" in sources, sources'
      - name: Kubernetes permissions are namespaced and read-only
        run: |
          sa=system:serviceaccount:opspilot:opspilot-mcp-server
          test "$(kubectl auth can-i get deployments --namespace shop --as "$sa")" = yes
          test "$(kubectl auth can-i list replicasets --namespace shop --as "$sa")" = yes
          test "$(kubectl auth can-i patch deployments --namespace shop --as "$sa")" = no
          test "$(kubectl auth can-i get deployments --namespace default --as "$sa")" = no
          test "$(kubectl auth can-i list secrets --namespace opspilot --as "$sa")" = no
          test "$(kubectl auth can-i get deployments --namespace shop --as system:serviceaccount:opspilot:opspilot-orchestrator)" = no
          echo "RBAC checks passed"
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods,svc,events --all-namespaces -o wide || true
          for pod in $(kubectl --namespace opspilot get pods -o name); do
            echo "::group::$pod"; kubectl --namespace opspilot describe "$pod" | tail -30; kubectl --namespace opspilot logs "$pod" --all-containers --tail 80 || true; echo "::endgroup::"
          done
      - name: Delete the owned cluster
        if: always()
        run: kind delete cluster --name opspilot-chart || true
