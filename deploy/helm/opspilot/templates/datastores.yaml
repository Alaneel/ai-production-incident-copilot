{{- if .Values.postgres.enabled }}
{{- $c := dict "root" . "component" "postgres" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opspilot.name" $c }}
  labels:
    {{- include "opspilot.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "opspilot.selector" $c | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "opspilot.name" $c }}
  labels:
    {{- include "opspilot.labels" $c | nindent 4 }}
spec:
  serviceName: {{ include "opspilot.name" $c }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "opspilot.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opspilot.labels" $c | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # postgres:17-alpine's postgres account is uid/gid 70.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_DB, value: incident_copilot}
            - {name: POSTGRES_USER, value: opspilot}
            {{- include "opspilot.secretEnv" (dict "root" . "name" "POSTGRES_PASSWORD" "key" "postgres-password") | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "opspilot", "-d", "incident_copilot"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "opspilot", "-d", "incident_copilot"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - {name: run, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
{{- if .Values.redis.enabled }}
{{- $c := dict "root" . "component" "redis" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opspilot.name" $c }}
  labels:
    {{- include "opspilot.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "opspilot.selector" $c | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opspilot.name" $c }}
  labels:
    {{- include "opspilot.labels" $c | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "opspilot.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opspilot.labels" $c | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # A delivery cache only: no persistence, bounded memory.
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            {{- include "opspilot.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - {name: data, emptyDir: {}}
{{- end }}
