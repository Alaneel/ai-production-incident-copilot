{{- if not .Values.auth.existingSecret }}
{{- $name := include "opspilot.secretName" . }}
{{- $previous := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $generated := dict }}
{{- range (list "orchestrator-read-token" "orchestrator-operator-token" "telemetry-gateway-token" "mcp-read-token" "mcp-operator-token" "mcp-approval-secret" "postgres-password") }}
{{- if hasKey $previous . }}
{{- $_ := set $generated . (index $previous . | b64dec) }}
{{- else }}
{{- $_ := set $generated . (randAlphaNum 48) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "opspilot.labels" (dict "root" . "component" "credentials") | nindent 4 }}
  annotations:
    # Generated once and kept on upgrade and uninstall, so a reinstall can
    # reopen the same database. Delete it yourself to rotate every credential.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $value := $generated }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  database-url: {{ printf "postgresql://opspilot:%s@%s:5432/incident_copilot" (get $generated "postgres-password") (include "opspilot.name" (dict "root" . "component" "postgres")) | b64enc }}
  {{- else if .Values.externalDatabase.url }}
  database-url: {{ .Values.externalDatabase.url | b64enc }}
  {{- end }}
  {{- if .Values.orchestrator.notifications.webhookUrl }}
  notify-webhook-url: {{ .Values.orchestrator.notifications.webhookUrl | b64enc }}
  {{- end }}
{{- end }}
