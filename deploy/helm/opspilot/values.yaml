# OpsPilot Helm values.
#
# The defaults install a read-only demo: deterministic telemetry fixtures,
# a bundled PostgreSQL and no permission to change anything in the cluster.
# Point `telemetry` at your Prometheus, Loki and Tempo to diagnose real
# services; enable `remediation` only for namespaces you want OpsPilot to be
# able to restart or roll back after a named human approves.

image:
  registry: ghcr.io/alaneel
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

telemetry:
  # Set all three to use live backends; leave all empty for demo fixtures.
  prometheusUrl: ""
  lokiUrl: ""
  tempoUrl: ""
  # A preset built into the gateway image: opentelemetry-kubernetes,
  # spring-boot-micrometer or fault-lab. See docs/integrate.md.
  signalProfile: opentelemetry-kubernetes
  # Or your own profile as a JSON string; takes precedence over the preset.
  #   signalProfileJson: |
  #     {"name": "team-stack", "metrics": {...}}
  signalProfileJson: ""

# Namespaces whose Deployments OpsPilot may read (rollout history, events)
# and, when remediation is enabled, restart or roll back. Each one gets a
# namespaced Role; OpsPilot never receives cluster-wide permissions.
targetNamespaces: []

discovery:
  # Read Deployment rollout history and events in targetNamespaces.
  enabled: false
  events: true

remediation:
  # Allow approved restart_deployment / rollback_release in targetNamespaces.
  # Every execution still needs a named human approval and a signed receipt.
  enabled: false

auth:
  # An existing Secret with these keys (see deploy/kubernetes/secret.example.yaml):
  # orchestrator-read-token, orchestrator-operator-token, telemetry-gateway-token,
  # mcp-read-token, mcp-operator-token, mcp-approval-secret, and, when the
  # bundled database is disabled, database-url. Leave empty to generate
  # random credentials once and keep them across upgrades.
  existingSecret: ""
  # Named on every approval the operator token makes.
  operatorActor: oncall-operator

orchestrator:
  replicas: 1
  # Console base URL used for links in alerts, notifications and MCP results.
  consoleUrl: ""
  # Browser origins allowed to call the API and /mcp (the console's origin).
  corsAllowedOrigins: []
  alerts:
    serviceLabels: service,service_name,app_kubernetes_io_name,app,job
    defaultEnvironment: prod
    maxDiagnosesPerWebhook: 5
    maxConcurrentDiagnoses: 2
    dedupeSeconds: 3600
  notifications:
    # Slack-compatible incoming webhook; stored in the generated Secret.
    webhookUrl: ""
    format: json
  model:
    # Optional OpenAI-compatible model for hypothesis generation. The key is
    # read from `existingSecret` key `openai-api-key` when set.
    name: ""
    baseUrl: ""
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}

mcpServer:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}

telemetryGateway:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 32Mi}
    limits: {cpu: 500m, memory: 128Mi}

postgres:
  # Bundled single-instance PostgreSQL. For production, disable it and set
  # externalDatabase or a `database-url` key in auth.existingSecret.
  enabled: true
  image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
  storage: 10Gi
  storageClassName: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

externalDatabase:
  # postgresql://user:password@host:5432/incident_copilot
  url: ""

redis:
  # Optional event-delivery cache. Without it, event streams replay from
  # checkpoints, which is slower but equally correct.
  enabled: false
  image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499

networkPolicy:
  enabled: true
  # Namespaces allowed to reach the orchestrator API (ingress controller,
  # Alertmanager). Pods in the release namespace are always allowed.
  ingressNamespaces: []

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []
