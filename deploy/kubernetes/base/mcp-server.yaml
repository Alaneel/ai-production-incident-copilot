apiVersion: v1
kind: Service
metadata:
  name: mcp-server
spec:
  selector:
    app.kubernetes.io/name: mcp-server
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-server
    spec:
      serviceAccountName: mcp-remediator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp-server
          image: incident-copilot/mcp-server
          env:
            - name: TELEMETRY_GATEWAY_URL
              value: http://telemetry-gateway:8081
            - name: TELEMETRY_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: incident-copilot-secrets
                  key: telemetry-gateway-token
            - name: MCP_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: incident-copilot-secrets
                  key: mcp-read-token
            - name: MCP_OPERATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: incident-copilot-secrets
                  key: mcp-operator-token
            - name: MCP_APPROVAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: incident-copilot-secrets
                  key: mcp-approval-secret
            - name: MCP_ALLOWED_ORIGINS
              value: https://incident-copilot.example.com
            - name: KUBERNETES_REMEDIATION_ENABLED
              value: "true"
            - name: MCP_ALLOWED_NAMESPACES
              value: incident-copilot
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
