apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-gateway
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-remediator
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-remediator
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-remediator
subjects:
  - kind: ServiceAccount
    name: mcp-remediator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-remediator
