apiVersion: v1
kind: Service
metadata:
  name: telemetry-gateway
spec:
  selector:
    app.kubernetes.io/name: telemetry-gateway
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-gateway
    spec:
      serviceAccountName: telemetry-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetry-gateway
          image: incident-copilot/telemetry-gateway
          env:
            - name: TELEMETRY_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: incident-copilot-secrets
                  key: telemetry-gateway-token
            - name: PROMETHEUS_URL
              value: http://prometheus.monitoring.svc.cluster.local:9090
            - name: LOKI_URL
              value: http://loki-gateway.monitoring.svc.cluster.local
            - name: TEMPO_URL
              value: http://tempo.monitoring.svc.cluster.local:3200
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
