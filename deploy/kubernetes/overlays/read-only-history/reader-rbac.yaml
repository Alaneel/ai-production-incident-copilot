apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-deployment-reader
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-deployment-reader
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-deployment-reader
subjects:
  - kind: ServiceAccount
    name: mcp-deployment-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-deployment-reader
