apiVersion: v1
kind: Secret
metadata:
  name: incident-copilot-secrets
  namespace: incident-copilot
type: Opaque
stringData:
  # Distinct random >=32-character secrets. Never use the Kind test credentials.
  orchestrator-read-token: REPLACE_ME
  orchestrator-operator-token: REPLACE_ME
  orchestrator-operator-actor: REPLACE_ME
  postgres-user: REPLACE_ME
  postgres-password: REPLACE_ME
  database-url: postgresql://REPLACE_ME:REPLACE_ME@postgres:5432/incident_copilot
  telemetry-gateway-token: REPLACE_ME
  mcp-read-token: REPLACE_ME
  mcp-operator-token: REPLACE_ME
  mcp-approval-secret: REPLACE_ME
  # Optional; also patch OPENAI_MODEL in the orchestrator Deployment.
  # openai-api-key: REPLACE_ME
