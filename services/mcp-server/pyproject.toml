[project]
name = "incident-copilot-mcp-server"
version = "0.2.0"
description = "Guarded MCP tool server for production incident diagnostics."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10"]

[build-system]
requires = ["hatchling==1.32.4", "editables==0.5"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["incident_mcp"]
