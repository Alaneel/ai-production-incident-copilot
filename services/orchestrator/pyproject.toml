[project]
name = "incident-copilot-orchestrator"
version = "0.2.0"
description = "Durable, evidence-first incident diagnosis workflow."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langgraph-sdk>=0.4.4,<0.5",
  "urllib3>=2.8.0,<3",
  "langgraph-checkpoint-postgres>=3.1.1,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.10,<3",
  "redis>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10"]

[build-system]
requires = ["hatchling==1.32.4", "editables==0.5"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["incident_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
